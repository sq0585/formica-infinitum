<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formica Infinitum</title>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Crimson+Pro:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --void:#07080c; --deep:#0d0f17; --surface:#131620; --ridge:#1c1f2e;
  --gold:#c8a84b; --gold-dim:#6a5518; --gold-pale:#e8d49a; --amber:#e8b84b;
  --text:#bcc0d0; --text-dim:#5a5e70; --text-bright:#eef0f8;
  --arc-accent:#c8a84b; --arc-dim:#6a5518;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--void);color:var(--text);font-family:'Crimson Pro',Georgia,serif;font-size:18px;line-height:1.9;min-height:100vh;}

/* ── TOPBAR ── */
#topbar{position:fixed;top:0;left:0;right:0;z-index:200;background:rgba(7,8,12,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--ridge);display:flex;align-items:center;gap:0;height:52px;}
#home-btn{background:none;border:none;border-right:1px solid var(--ridge);padding:0 14px;height:100%;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--gold);font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:2px;white-space:nowrap;transition:background .2s;flex-shrink:0;touch-action:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;}
#home-btn:hover{background:var(--surface);}
#home-btn span{font-size:20px;}
#home-btn .home-label{display:inline;}
#breadcrumb{padding:0 10px;font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#nav-arrows{display:flex;border-left:1px solid var(--ridge);flex-shrink:0;}
.nav-arr{background:none;border:none;border-right:1px solid var(--ridge);width:40px;height:52px;cursor:pointer;color:var(--text-dim);font-size:16px;transition:all .2s;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.nav-arr:last-child{border-right:none;}
.nav-arr:hover{color:var(--gold);background:var(--surface);}
.nav-arr.disabled{opacity:.25;pointer-events:none;}
@media (max-width:480px){
  #home-btn .home-label{display:none;}
  #home-btn{padding:0 10px;}
  #breadcrumb{font-size:8px;padding:0 8px;}
  .nav-arr{width:36px;}
}

/* ── VIEWS ── */
#view-home,#view-chapter{padding-top:52px;}
#view-chapter{display:none;}

/* ── HERO ── */
.hero{position:relative;overflow:hidden;text-align:center;padding:0;}
.hero-cover{display:block;width:100%;height:520px;object-fit:cover;object-position:center 30%;}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(7,8,12,0.15) 0%,rgba(7,8,12,0.5) 55%,rgba(7,8,12,1) 100%);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:48px;}
.ant-icon{font-size:56px;display:block;margin-bottom:14px;}
.hero h1{font-family:'Cinzel',serif;font-size:clamp(26px,5vw,54px);font-weight:900;color:var(--text-bright);letter-spacing:4px;text-shadow:0 2px 24px rgba(0,0,0,.8);}
.hero-sub{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin:8px 0 14px;text-shadow:0 1px 8px rgba(0,0,0,.9);}
.hero-desc{max-width:520px;margin:0 auto;font-style:italic;color:var(--text-dim);font-size:.95em;line-height:1.75;}

/* ── CHAPTER LIST ── */
.list-wrap{max-width:760px;margin:0 auto;padding:40px 20px 80px;}
.arc-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:5px;text-transform:uppercase;padding:28px 0 10px;display:flex;align-items:center;gap:12px;}
.arc-rule{flex:1;height:1px;display:block;}
.ch-row{display:flex;align-items:stretch;margin-bottom:2px;cursor:pointer;transition:transform .15s;}
.ch-row:hover{transform:translateX(4px);}
.ch-row:hover .ch-num{background:var(--arc-dim);}
.ch-row:hover .ch-body-row{background:var(--surface);}
.ch-num{background:var(--deep);border-left:3px solid var(--arc-accent);min-width:52px;display:flex;align-items:center;justify-content:center;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;color:var(--arc-accent);letter-spacing:1px;padding:4px 6px;transition:background .15s;}
.ch-body-row{background:var(--deep);flex:1;padding:14px 18px;transition:background .15s;}
.ch-title-row{font-family:'Cinzel',serif;font-size:14px;font-weight:700;color:var(--text-bright);}
.ch-arc-tag{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:2px;color:var(--text-dim);text-transform:uppercase;margin-top:3px;}
.ch-arrow{display:flex;align-items:center;padding:0 16px;background:var(--deep);color:var(--text-dim);font-size:13px;transition:background .15s;}
.ch-row:hover .ch-arrow{color:var(--arc-accent);background:var(--surface);}

/* ── CHAPTER VIEW ── */
.ch-view-inner{max-width:680px;margin:0 auto;padding:56px 24px 100px;}
.ch-header{margin-bottom:48px;padding-bottom:28px;border-bottom:1px solid var(--ridge);}
.ch-num-large{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:4px;text-transform:uppercase;margin-bottom:10px;color:var(--arc-accent);}
.ch-title-large{font-family:'Cinzel',serif;font-size:clamp(20px,3vw,32px);font-weight:700;color:var(--text-bright);line-height:1.25;margin-bottom:6px;}
.ch-arc-large{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}

/* ── PROSE ── */
#prose-body{color:var(--text);font-size:1.05em;line-height:2;}
#prose-body p{margin-bottom:1.4em;}
#prose-body h1,#prose-body h2,#prose-body h3{font-family:'Cinzel',serif;color:var(--text-bright);margin:2em 0 .6em;line-height:1.3;}
#prose-body h1{font-size:1.4em;}
#prose-body h2{font-size:1.2em;color:var(--arc-accent);}
#prose-body h3{font-size:1em;letter-spacing:1px;text-transform:uppercase;color:var(--gold-pale);}
#prose-body em{color:var(--text-bright);font-style:italic;}
#prose-body strong{color:var(--gold-pale);font-weight:600;}
#prose-body hr{border:none;border-top:1px solid var(--ridge);margin:2.5em 0;}
#prose-body blockquote{border-left:3px solid var(--arc-dim);padding:16px 20px;margin:1.5em 0;background:var(--deep);font-style:italic;color:var(--text-dim);}
#prose-body blockquote p{margin-bottom:.9em;line-height:1.85;}
#prose-body blockquote p:last-child{margin-bottom:0;}
.tts-sentence.tts-reading{background:rgba(200,168,75,.16);border-radius:2px;transition:background .25s;}

/* ── BOTTOM NAV ── */
.bottom-nav{display:flex;gap:2px;margin-top:60px;border-top:1px solid var(--ridge);padding-top:24px;}
.bnav-btn{flex:1;background:var(--deep);border:none;padding:16px 20px;cursor:pointer;color:var(--text-dim);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;transition:all .2s;text-align:left;}
.bnav-btn:hover{background:var(--surface);color:var(--arc-accent);}
.bnav-btn.right{text-align:right;}
.bnav-btn.hidden{visibility:hidden;pointer-events:none;}
.bnav-label{font-family:'Cinzel',serif;font-size:13px;font-weight:700;color:var(--text-bright);display:block;margin-top:4px;letter-spacing:0;}

/* ── CONTINUE BANNER ── */
#continue-bar{display:none;margin:0 auto 0;max-width:760px;padding:0 20px;}
#continue-btn{width:100%;background:var(--deep);border:none;border-left:3px solid var(--gold);padding:14px 18px;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:background .2s;margin-bottom:2px;}
#continue-btn:hover{background:var(--surface);}
#continue-label{font-family:'Space Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}
#continue-title{font-family:'Cinzel',serif;font-size:14px;color:var(--text-bright);margin-top:3px;text-align:left;}
#continue-arrow{color:var(--gold);font-size:18px;flex-shrink:0;}

/* ── LOADING / ERROR ── */
.state-msg{text-align:center;padding:80px 24px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;}
.state-msg .icon{font-size:36px;display:block;margin-bottom:16px;}

/* ── PROGRESS BAR ── */
#progress{position:fixed;top:52px;left:0;height:2px;background:var(--arc-accent);width:0%;z-index:199;transition:width .1s;}

/* ── SCROLL TOP ── */
#scroll-top{position:fixed;bottom:28px;right:24px;width:40px;height:40px;background:var(--deep);border:1px solid var(--ridge);color:var(--text-dim);font-size:16px;cursor:pointer;display:none;align-items:center;justify-content:center;transition:all .2s;z-index:150;}
#scroll-top:hover{border-color:var(--gold);color:var(--gold);}
#scroll-top.show{display:flex;}

/* ── TTS PLAYER (easter egg) ── */
#tts-bar{position:fixed;bottom:0;left:0;right:0;z-index:190;background:rgba(7,8,12,.97);backdrop-filter:blur(16px);border-top:1px solid var(--ridge);display:none;align-items:center;gap:10px;padding:10px 16px;flex-wrap:wrap;}
#tts-bar.active{display:flex;}
.tts-btn{background:var(--deep);border:1px solid var(--ridge);color:var(--arc-accent);width:36px;height:36px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .15s;}
.tts-btn:hover{border-color:var(--arc-accent);}
.tts-btn.primary{width:42px;height:42px;background:var(--arc-dim);border-color:var(--arc-accent);color:var(--text-bright);}
#tts-label,#tts-label-pitch{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:1px;color:var(--text-dim);text-transform:uppercase;flex-shrink:0;}
#tts-rate,#tts-pitch{width:60px;accent-color:var(--arc-accent);}
#tts-voice{background:var(--deep);border:1px solid var(--ridge);color:var(--text-dim);font-family:'Space Mono',monospace;font-size:9px;padding:6px 8px;max-width:140px;flex-shrink:1;}
.tts-toggle{background:none;border:1px solid var(--ridge);color:var(--arc-accent);cursor:pointer;display:none;align-items:center;gap:8px;font-family:'Cinzel',serif;font-weight:700;font-size:13px;letter-spacing:1px;padding:8px 14px;transition:all .2s;}
.tts-toggle.unlocked{display:flex;}
.tts-toggle:hover{border-color:var(--arc-accent);background:var(--surface);}
.tts-spacer{flex:1;}

/* ── GESTURE OVERLAY ── */
#gesture-canvas {
  position: fixed;
  inset: 0;
  z-index: 9999;
  pointer-events: none;
  background: rgba(7, 8, 12, 0);
  box-shadow: inset 0 0 80px rgba(200, 168, 75, 0);
  transition: background 0.4s ease, box-shadow 0.4s ease;
}
#gesture-toast {
  position: fixed;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: rgba(19, 22, 32, 0.95);
  border: 1px solid var(--ridge);
  padding: 10px 20px;
  font-family: 'Space Mono', monospace;
  font-size: 11px;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--text);
  z-index: 10000;
  opacity: 0;
  pointer-events: none;
  transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
</style>
</head>
<body>

<div id="topbar">
  <button id="home-btn" title="Formica Infinitum (Home) · Trace the sacred geometry of the hive to unlock the voice..."><span>🐜</span><span class="home-label">FORMICA INFINITUM</span></button>
  <div id="breadcrumb">Arc I — The Night Shift</div>
  <div id="nav-arrows">
    <button class="nav-arr disabled" id="btn-prev" onclick="navigate(-1)" title="Previous chapter">‹</button>
    <button class="nav-arr disabled" id="btn-next" onclick="navigate(1)" title="Next chapter">›</button>
  </div>
</div>

<div id="progress"></div>

<!-- HOME VIEW -->
<div id="view-home">
  <div class="hero">
    <div class="hex-bg"></div>
    <img src="assets/cover.png" alt="Formica Infinitum Cover" class="hero-cover"
      onerror="this.style.display='none'">
    <div class="hero-overlay">
      <div class="hero-sub">The Eternal Ant Legacy</div>
      <h1>FORMICA INFINITUM</h1>
    </div>
  </div>
  <div id="continue-bar">
    <button id="continue-btn" onclick="resumeReading()">
      <div style="text-align:left">
        <div id="continue-label">Continue Reading</div>
        <div id="continue-title"></div>
      </div>
      <div id="continue-arrow">→</div>
    </button>
  </div>
  <div class="list-wrap" id="chapter-list">
    <div class="state-msg"><span class="icon">⟳</span>Loading chapters...</div>
  </div>
</div>

<!-- CHAPTER VIEW -->
<div id="view-chapter">
  <div class="ch-view-inner">
    <div class="ch-header">
      <div class="ch-num-large" id="ch-num-display">Chapter —</div>
      <div class="ch-title-large" id="ch-title-display">—</div>
      <div class="ch-arc-large" id="ch-arc-display">Arc I · The Night Shift</div>
      <button class="tts-toggle" id="tts-toggle-btn" onclick="toggleTTS()" style="margin-top:18px">
        🔊 <span id="tts-toggle-label">Listen to this chapter</span>
      </button>
    </div>
    <div id="prose-body"><div class="state-msg"><span class="icon">⟳</span>Loading...</div></div>
    <div class="bottom-nav">
      <button class="bnav-btn" id="bnav-prev" onclick="navigate(-1)">
        ← Previous<span class="bnav-label" id="bnav-prev-title"></span>
      </button>
      <button class="bnav-btn right" id="bnav-next" onclick="navigate(1)">
        Next →<span class="bnav-label" id="bnav-next-title"></span>
      </button>
    </div>
  </div>
</div>

<button id="scroll-top" onclick="window.scrollTo({top:0,behavior:'smooth'})">↑</button>

<div id="tts-bar">
  <button class="tts-btn primary" id="tts-play" onclick="ttsPlayPause()" title="Play/Pause">▶</button>
  <button class="tts-btn" onclick="ttsStop()" title="Stop">■</button>
  <span id="tts-label">Speed</span>
  <input type="range" id="tts-rate" min="0.6" max="2" step="0.1" value="1" oninput="ttsRateChange(this.value)">
  <span id="tts-label-pitch">Pitch</span>
  <input type="range" id="tts-pitch" min="0" max="2" step="0.1" value="1" oninput="ttsPitchChange(this.value)">
  <select id="tts-voice" onchange="ttsVoiceChange()"></select>
  <div class="tts-spacer"></div>
  <button class="tts-btn" onclick="closeTTS()" title="Close">✕</button>
</div>

<canvas id="gesture-canvas"></canvas>
<div id="gesture-toast"></div>

<script>
const REPO = 'sq0585/formica-infinitum';
const RAW  = `https://raw.githubusercontent.com/${REPO}/main`;
const ARC_NAMES = { 1:'Arc I · The Night Shift', 2:'Arc II · The City Below', 3:'Arc III', 4:'Arc IV', 5:'Arc V', 6:'Arc VI', 7:'Arc VII' };
const ARC_COLORS = {
  1: { accent:'#c8a84b', dim:'#6a5518' },
  2: { accent:'#5bb8d4', dim:'#1f4a57' },
  3: { accent:'#e08a3c', dim:'#6e3d15' },
  4: { accent:'#b07ce0', dim:'#4a2e6e' },
  5: { accent:'#4cd49a', dim:'#155e3f' },
  6: { accent:'#4c9ed4', dim:'#15405e' },
  7: { accent:'#e0524c', dim:'#6e1815' }
};
function arcColor(arc) { return ARC_COLORS[arc] || ARC_COLORS[1]; }

let chapters = [], currentIdx = -1;

// ── Simple Markdown renderer ──
function parseMd(md) {
  const lines = md.split('\n');
  let html = '', inP = false, bqLines = [];

  const closeP  = () => { if (inP) { html += '</p>\n'; inP = false; } };
  const openP   = () => { if (!inP) { html += '<p>'; inP = true; } };
  const flushBq = () => {
    if (!bqLines.length) return;
    let content = '<p>';
    for (let j = 0; j < bqLines.length; j++) {
      if (bqLines[j] === '') {
        content = content.trimEnd() + '</p><p>';
      } else {
        content += inline(bqLines[j]) + ' ';
      }
    }
    content = content.trimEnd() + '</p>';
    content = content.replace(/<p>\s*<\/p>/g, '');
    html += `<blockquote>${content}</blockquote>\n`;
    bqLines = [];
  };

  for (let i = 0; i < lines.length; i++) {
    const l = lines[i];
    if (/^>\s?/.test(l)) {
      closeP();
      bqLines.push(l.replace(/^>\s?/, ''));
      continue;
    }
    if (bqLines.length) { flushBq(); }

    const hl = l.match(/^(#{1,3})\s+(.*)/);
    if (hl) { closeP(); const t = hl[1].length; html += `<h${t}>${inline(hl[2])}</h${t}>\n`; continue; }
    if (/^---+$/.test(l.trim())) { closeP(); html += '<hr>\n'; continue; }
    if (l.trim() === '') { closeP(); continue; }
    openP(); html += inline(l) + ' ';
  }
  flushBq();
  closeP();
  return html;
}

function inline(s) {
  return s
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/_(.+?)_/g, '<em>$1</em>');
}

// Remove leading front-matter lines that duplicate what's already shown in
// the page header (book title, series name, arc name, chapter heading, etc.)
// Strips any leading run of heading lines, divider lines, and blank lines
// until it hits the first real paragraph of prose.
function stripDuplicateTitle(md, title) {
  const lines = md.split('\n');
  let i = 0;

  while (i < lines.length) {
    const t = lines[i].trim();
    if (t === '') { i++; continue; }
    if (/^#{1,3}\s+/.test(t)) { i++; continue; }
    if (/^---+$/.test(t)) { i++; continue; }
    break; // hit the first real content line
  }

  return lines.slice(i).join('\n');
}

// ── Persistence ──
const STORAGE_KEY = 'formica_last';

function saveProgress() {
  if (currentIdx < 0) return;
  localStorage.setItem(STORAGE_KEY, JSON.stringify({
    idx: currentIdx,
    scroll: window.scrollY
  }));
  location.hash = chapters[currentIdx].id;
}

function loadProgress() {
  const hash = location.hash.replace('#','');
  if (hash) {
    const i = chapters.findIndex(c => c.id === hash);
    if (i >= 0) { loadChapter(i); return; }
  }
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && saved.idx >= 0 && saved.idx < chapters.length) {
      const ch = chapters[saved.idx];
      const num = String(saved.idx+1).padStart(2,'0');
      document.getElementById('continue-title').textContent = `Ch.${num} — ${ch.title}`;
      document.getElementById('continue-bar').style.display = 'block';
      window._resumeScroll = saved.scroll || 0;
    }
  } catch(e) {}
}

function resumeReading() {
  const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
  if (!saved) return;
  loadChapter(saved.idx, saved.scroll);
}

// ── Fetch chapters index ──
async function init() {
  try {
    const r = await fetch(`${RAW}/chapters.json`);
    if (!r.ok) throw new Error('Could not load chapters.json');
    chapters = await r.json();
    renderList();
    updateArrows();
    loadProgress();
  } catch(e) {
    document.getElementById('chapter-list').innerHTML =
      `<div class="state-msg"><span class="icon">⚠</span>${e.message}</div>`;
  }
}

// ── Render home list ──
function renderList() {
  const el = document.getElementById('chapter-list');
  let html = '', lastArc = null;
  chapters.forEach((ch, i) => {
    if (ch.arc !== lastArc) {
      const c = arcColor(ch.arc);
      html += `<div class="arc-label" style="color:${c.accent}">${ARC_NAMES[ch.arc] || 'Arc ' + ch.arc}<span class="arc-rule" style="background:linear-gradient(to right,${c.dim},transparent)"></span></div>`;
      lastArc = ch.arc;
    }
    const c = arcColor(ch.arc);
    const num = String(i+1).padStart(2,'0');
    html += `<div class="ch-row" onclick="loadChapter(${i})" style="--arc-accent:${c.accent};--arc-dim:${c.dim}">
      <div class="ch-num">Ch.${num}</div>
      <div class="ch-body-row">
        <div class="ch-title-row">${ch.title}</div>
        <div class="ch-arc-tag">${ARC_NAMES[ch.arc] || ''}</div>
      </div>
      <div class="ch-arrow">›</div>
    </div>`;
  });
  el.innerHTML = html;
}

// ── Load a chapter ──
async function loadChapter(idx, restoreScroll = 0) {
  currentIdx = idx;
  const ch = chapters[idx];
  const num = String(idx+1).padStart(2,'0');

  // reset TTS for the new chapter
  ttsStop();
  document.getElementById('tts-bar').classList.remove('active');
  ttsActive = false;
  document.getElementById('tts-toggle-label').textContent = 'Listen to this chapter';

  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-chapter').style.display = 'block';
  window.scrollTo(0,0);

  // Header + arc theming
  document.getElementById('ch-num-display').textContent = `Chapter ${num}`;
  document.getElementById('ch-title-display').textContent = ch.title;
  document.getElementById('ch-arc-display').textContent = ARC_NAMES[ch.arc] || '';
  document.getElementById('breadcrumb').textContent = `Ch.${num} — ${ch.title}`;

  const c = arcColor(ch.arc);
  document.documentElement.style.setProperty('--arc-accent', c.accent);
  document.documentElement.style.setProperty('--arc-dim', c.dim);

  updateArrows();

  document.getElementById('prose-body').innerHTML =
    '<div class="state-msg"><span class="icon">⟳</span>Loading chapter...</div>';

  try {
    const r = await fetch(`${RAW}/chapters/${ch.id}.md`);
    if (!r.ok) throw new Error(`Chapter file not found: ${ch.id}.md`);
    const md = await r.text();
    document.getElementById('prose-body').innerHTML = parseMd(stripDuplicateTitle(md, ch.title));
    document.getElementById('prose-body').dataset.ttsReady = '';
    if (restoreScroll) setTimeout(() => window.scrollTo(0, restoreScroll), 50);
  } catch(e) {
    document.getElementById('prose-body').innerHTML =
      `<div class="state-msg"><span class="icon">⚠</span>${e.message}</div>`;
  }
}

function showHome() {
  document.getElementById('view-home').style.display = 'block';
  document.getElementById('view-chapter').style.display = 'none';
  document.getElementById('breadcrumb').textContent = 'Arc I — The Night Shift';
  location.hash = '';
  window.scrollTo(0,0);
}

// ── Easter egg: trace the sacred shape to unlock the listen player (or tap the ant icon 5x) ──
let antTapCount = 0;
let antTapTimer = null;
let ttsUnlocked = false;

function handleAntClick() {
  showHome();
  antTapCount++;
  clearTimeout(antTapTimer);
  antTapTimer = setTimeout(() => { antTapCount = 0; }, 1500);
  if (antTapCount >= 5) {
    antTapCount = 0;
    unlockTTS();
    showToast("A persistent searcher unlocks the voice.", true);
  }
}

function unlockTTS() {

  ttsUnlocked = true;
  document.getElementById('tts-toggle-btn').classList.add('unlocked');

  home.style.color = 'var(--amber)';

}

// ── Gesture Tracking & Shape Recognition ──
let isDrawing = false;
let hasMoved = false;
let startX = 0, startY = 0;
let drawnPoints = [];
let pathAlpha = 0;
let animId = null;
let particles = [];

const canvas = document.getElementById('gesture-canvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  if (canvas.width !== window.innerWidth || canvas.height !== window.innerHeight) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
}

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.vx = (Math.random() - 0.5) * 4;
    this.vy = (Math.random() - 0.5) * 4;
    this.radius = Math.random() * 3 + 2;
    this.alpha = 1;
    this.decay = Math.random() * 0.02 + 0.015;
    this.color = color || '#c8a84b';
  }
  update() {
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 8;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.restore();
  }
}

function createParticle(x, y, color) {
  particles.push(new Particle(x, y, color));
}

function startAnimLoop() {
  if (!animId) {
    animId = requestAnimationFrame(drawLoop);
  }
}

function drawLoop() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  
  // Update and draw particles
  particles = particles.filter(p => p.alpha > 0);
  particles.forEach(p => {
    p.update();
    p.draw();
  });
  
  // Draw path
  if (drawnPoints.length > 1 && pathAlpha > 0) {
    ctx.save();
    ctx.globalAlpha = pathAlpha;
    ctx.beginPath();
    ctx.moveTo(drawnPoints[0].x, drawnPoints[0].y);
    for (let i = 1; i < drawnPoints.length; i++) {
      ctx.lineTo(drawnPoints[i].x, drawnPoints[i].y);
    }
    ctx.strokeStyle = '#c8a84b';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.shadowBlur = 15;
    ctx.shadowColor = '#e8b84b';
    ctx.stroke();
    ctx.restore();
    
    if (!isDrawing) {
      pathAlpha -= 0.05;
    }
  }
  
  if (particles.length > 0 || (drawnPoints.length > 1 && pathAlpha > 0) || isDrawing) {
    animId = requestAnimationFrame(drawLoop);
  } else {
    animId = null;
  }
}

function triggerGoldBurst() {
  const c = centroid(drawnPoints);
  const colors = ['#e8d49a', '#c8a84b', '#e8b84b', '#ffffff'];
  for (let i = 0; i < 80; i++) {
    const p = new Particle(c.x, c.y, colors[Math.floor(Math.random() * colors.length)]);
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 8 + 3;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    p.radius = Math.random() * 4 + 2;
    p.decay = Math.random() * 0.01 + 0.01;
    particles.push(p);
  }
  startAnimLoop();
}

function triggerFailureGlow() {
  const lastPt = drawnPoints[drawnPoints.length - 1];
  for (let i = 0; i < 20; i++) {
    const p = new Particle(lastPt.x, lastPt.y, '#e0524c');
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3 + 1;
    p.vx = Math.cos(angle) * speed;
    p.vy = Math.sin(angle) * speed;
    p.decay = 0.03;
    particles.push(p);
  }
  startAnimLoop();
}

function showToast(msg, isSuccess) {
  const toast = document.getElementById('gesture-toast');
  if (!toast) return;
  toast.textContent = msg;
  toast.style.borderColor = isSuccess ? 'var(--gold)' : '#e0524c';
  toast.style.color = isSuccess ? 'var(--gold-pale)' : '#eef0f8';
  toast.style.opacity = '1';
  toast.style.transform = 'translateX(-50%) translateY(0)';
  
  clearTimeout(toast.timeout);
  toast.timeout = setTimeout(() => {
    toast.style.opacity = '0';
    toast.style.transform = 'translateX(-50%) translateY(20px)';
  }, 2500);
}

// ── Math & Recognizer Utils ──
function distance(p1, p2) {
  const dx = p2.x - p1.x;
  const dy = p2.y - p1.y;
  return Math.sqrt(dx * dx + dy * dy);
}

function pathLength(points) {
  let d = 0;
  for (let i = 1; i < points.length; i++) {
    d += distance(points[i - 1], points[i]);
  }
  return d;
}

function resample(points, n) {
  const pts = points.map(p => ({ x: p.x, y: p.y }));
  const I = pathLength(pts) / (n - 1);
  let D = 0;
  const newPoints = [{ x: pts[0].x, y: pts[0].y }];
  let i = 1;
  while (i < pts.length) {
    const p1 = pts[i - 1];
    const p2 = pts[i];
    const d = distance(p1, p2);
    if (d === 0) {
      i++;
      continue;
    }
    if ((D + d) >= I) {
      const t = (I - D) / d;
      const q = {
        x: p1.x + t * (p2.x - p1.x),
        y: p1.y + t * (p2.y - p1.y)
      };
      newPoints.push(q);
      pts[i - 1] = q;
      D = 0;
    } else {
      D += d;
      i++;
    }
  }
  while (newPoints.length < n) {
    newPoints.push({ x: points[points.length - 1].x, y: points[points.length - 1].y });
  }
  return newPoints.slice(0, n);
}

function centroid(points) {
  let x = 0, y = 0;
  for (let i = 0; i < points.length; i++) {
    x += points[i].x;
    y += points[i].y;
  }
  return { x: x / points.length, y: y / points.length };
}

function boundingBox(points) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (let i = 0; i < points.length; i++) {
    minX = Math.min(minX, points[i].x);
    maxX = Math.max(maxX, points[i].x);
    minY = Math.min(minY, points[i].y);
    maxY = Math.max(maxY, points[i].y);
  }
  return { x: minX, y: minY, width: maxX - minX, height: maxY - minY };
}

function scaleTo(points, size) {
  const box = boundingBox(points);
  const maxDim = Math.max(box.width, box.height, 1);
  const newPoints = [];
  for (let i = 0; i < points.length; i++) {
    const px = points[i].x * (size / maxDim);
    const py = points[i].y * (size / maxDim);
    newPoints.push({ x: px, y: py });
  }
  return newPoints;
}

function translateTo(points, pt) {
  const c = centroid(points);
  const newPoints = [];
  for (let i = 0; i < points.length; i++) {
    const px = points[i].x + pt.x - c.x;
    const py = points[i].y + pt.y - c.y;
    newPoints.push({ x: px, y: py });
  }
  return newPoints;
}

function rotateBy(points, theta) {
  const c = centroid(points);
  const cos = Math.cos(theta);
  const sin = Math.sin(theta);
  const newPoints = [];
  for (let i = 0; i < points.length; i++) {
    const dx = points[i].x - c.x;
    const dy = points[i].y - c.y;
    const rx = dx * cos - dy * sin + c.x;
    const ry = dx * sin + dy * cos + c.y;
    newPoints.push({ x: rx, y: ry });
  }
  return newPoints;
}

function alignRotation(points) {
  const c = centroid(points);
  const p0 = points[0];
  const theta = Math.atan2(p0.y - c.y, p0.x - c.x);
  return rotateBy(points, -theta);
}

function pathDistance(path1, path2) {
  let d = 0;
  for (let i = 0; i < path1.length; i++) {
    d += distance(path1[i], path2[i]);
  }
  return d / path1.length;
}

function generateHexagonTemplate(n) {
  const vertices = [];
  for (let i = 0; i <= 6; i++) {
    const angle = (i * Math.PI / 3);
    vertices.push({ x: Math.cos(angle), y: Math.sin(angle) });
  }
  return resample(vertices, n);
}

function generateCircleTemplate(n) {
  const vertices = [];
  for (let i = 0; i < n; i++) {
    const angle = (i * Math.PI * 2) / n;
    vertices.push({ x: Math.cos(angle), y: Math.sin(angle) });
  }
  return vertices;
}

function scoreAgainstTemplate(pts, template) {
  const N = pts.length;
  let tempPts = scaleTo(template, 100);
  tempPts = translateTo(tempPts, { x: 0, y: 0 });
  
  let minD = Infinity;
  for (let shift = 0; shift < N; shift++) {
    let shifted = [];
    for (let i = 0; i < N; i++) {
      shifted.push(tempPts[(i + shift) % N]);
    }
    shifted = alignRotation(shifted);
    
    const d1 = pathDistance(pts, shifted);
    if (d1 < minD) minD = d1;
    
    let reversed = [...shifted].reverse();
    reversed = alignRotation(reversed);
    const d2 = pathDistance(pts, reversed);
    if (d2 < minD) minD = d2;
  }
  return Math.max(0, 1 - minD / 30);
}

function checkGesture(inputPoints) {
  if (inputPoints.length < 10) return 0;
  
  const N = 64;
  let pts = resample(inputPoints, N);
  pts = scaleTo(pts, 100);
  pts = translateTo(pts, { x: 0, y: 0 });
  pts = alignRotation(pts);
  
  const hexTemplate = generateHexagonTemplate(N);
  const circleTemplate = generateCircleTemplate(N);
  
  const scoreHex = scoreAgainstTemplate(pts, hexTemplate);
  const scoreCircle = scoreAgainstTemplate(pts, circleTemplate);
  
  console.log(`Cell symmetry: ${scoreHex.toFixed(3)}, Curvature: ${scoreCircle.toFixed(3)}`);
  
  if (scoreHex > 0.80 && scoreHex > scoreCircle) {
    const percent = Math.round(scoreHex * 100);
    showToast(`The six-fold boundary is complete (Symmetry: ${percent}%). Secret unlocked.`, true);
    return scoreHex;
  } else if (scoreCircle > 0.85 && scoreCircle > scoreHex) {
    showToast("A loop of pure curvature... but the colony builds with corners and straight walls.", false);
  } else {
    const percent = Math.round(scoreHex * 100);
    showToast(`The trace is lost. Cell symmetry: ${percent}%.`, false);
  }
  return 0;
}

// ── Event Handlers & Scanner ──
let drawModeTimer = null;
let isDrawingMode = false;
let activeStartElement = null;

function handleAntStart(e) {
  if (e.target.closest('.nav-arr')) return;
  if (e.cancelable) e.preventDefault();
  
  resizeCanvas();
  
  const touch = e.touches ? e.touches[0] : e;
  startX = touch.clientX;
  startY = touch.clientY;
  drawnPoints = [];
  isDrawing = false;
  activeStartElement = e.target;
  
  clearTimeout(drawModeTimer);
  drawModeTimer = setTimeout(enterDrawingMode, 500);
}

function enterDrawingMode() {
  drawModeTimer = null;
  isDrawingMode = true;
  isDrawing = true;
  pathAlpha = 1;
  
  if (navigator.vibrate) navigator.vibrate(40);
  
  const cvs = document.getElementById('gesture-canvas');
  cvs.style.pointerEvents = 'auto';
  cvs.style.background = 'rgba(7, 8, 12, 0.7)';
  cvs.style.boxShadow = 'inset 0 0 80px rgba(200, 168, 75, 0.2)';
  
  showToast("The hive scanner is active. Trace the geometry...", true);
  resizeCanvas();
  startAnimLoop();
}

function exitDrawingMode() {
  isDrawingMode = false;
  isDrawing = false;
  activeStartElement = null;
  
  const cvs = document.getElementById('gesture-canvas');
  cvs.style.pointerEvents = 'none';
  cvs.style.background = 'transparent';
  cvs.style.boxShadow = 'none';
}

function handleGlobalMove(e) {
  if (!isDrawingMode) {
    if (drawModeTimer) {
      const touch = e.touches ? e.touches[0] : e;
      const dx = touch.clientX - startX;
      const dy = touch.clientY - startY;
      if (Math.sqrt(dx*dx + dy*dy) > 15) {
        clearTimeout(drawModeTimer);
        drawModeTimer = null;
      }
    }
    return;
  }
  
  if (!isDrawing) return;
  
  if (e.cancelable) e.preventDefault();
  const touch = e.touches ? e.touches[0] : e;
  const x = touch.clientX;
  const y = touch.clientY;
  
  drawnPoints.push({ x, y });
  createParticle(x, y);
  startAnimLoop();
}

function handleGlobalEnd(e) {
  if (drawModeTimer) {
    clearTimeout(drawModeTimer);
    drawModeTimer = null;
    // Only navigate home if we actually tapped the home button or inside it
    if (activeStartElement && activeStartElement.closest('#home-btn')) {
      handleAntClick();
    }
    activeStartElement = null;
    return;
  }
  
  if (!isDrawingMode) return;
  isDrawing = false;
  
  if (drawnPoints.length > 5) {
    const score = checkGesture(drawnPoints);
    if (score > 0) {
      unlockTTS();
      triggerGoldBurst();
    } else {
      triggerFailureGlow();
    }
  }
  exitDrawingMode();
}

// Attach Event Listeners
const topBar = document.getElementById('topbar');
if (topBar) {
  topBar.addEventListener('mousedown', handleAntStart);
  topBar.addEventListener('touchstart', handleAntStart, { passive: false });
}

window.addEventListener('mousemove', handleGlobalMove);
window.addEventListener('touchmove', handleGlobalMove, { passive: false });

window.addEventListener('mouseup', handleGlobalEnd);
window.addEventListener('touchend', handleGlobalEnd);

function navigate(dir) {
  const next = currentIdx + dir;
  if (next >= 0 && next < chapters.length) loadChapter(next);
}

function updateArrows() {
  const hasPrev = currentIdx > 0;
  const hasNext = currentIdx < chapters.length - 1;

  const btnPrev = document.getElementById('btn-prev');
  const btnNext = document.getElementById('btn-next');
  btnPrev.classList.toggle('disabled', !hasPrev);
  btnNext.classList.toggle('disabled', !hasNext);

  const bPrev = document.getElementById('bnav-prev');
  if (hasPrev) {
    bPrev.classList.remove('hidden');
    document.getElementById('bnav-prev-title').textContent = chapters[currentIdx - 1].title;
  } else {
    bPrev.classList.add('hidden');
  }

  const bNext = document.getElementById('bnav-next');
  if (hasNext) {
    bNext.classList.remove('hidden');
    document.getElementById('bnav-next-title').textContent = chapters[currentIdx + 1].title;
  } else {
    bNext.classList.add('hidden');
  }
}

// ── Reading progress bar + save ──
window.addEventListener('scroll', () => {
  const doc = document.documentElement;
  const pct = (doc.scrollTop / (doc.scrollHeight - doc.clientHeight)) * 100;
  document.getElementById('progress').style.width = pct + '%';
  document.getElementById('scroll-top').classList.toggle('show', doc.scrollTop > 400);
  if (document.getElementById('view-chapter').style.display !== 'none') saveProgress();
});

// ── Keyboard nav ──
document.addEventListener('keydown', e => {
  if (document.getElementById('view-chapter').style.display === 'none') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   navigate(-1);
  if (e.key === 'Escape') showHome();
});

// ── Text-to-Speech (free, browser-native, works on mobile + desktop) ──
let ttsUtterances = [];
let ttsIdx = 0;
let ttsActive = false;
let ttsPaused = false;
let ttsVoices = [];
let ttsRate = 1;
let ttsPitch = 1;

function loadVoices() {
  ttsVoices = speechSynthesis.getVoices().filter(v => v.lang === 'en-GB' || v.lang === 'en-US');
  if (!ttsVoices.length) ttsVoices = speechSynthesis.getVoices().filter(v => v.lang === 'en');
  if (!ttsVoices.length) ttsVoices = speechSynthesis.getVoices();
  const sel = document.getElementById('tts-voice');
  let options = '';
  if (ttsVoices.length > 0) {
    options = ttsVoices.map((v,i) => `<option value="${i}">${v.name} (${v.lang})</option>`).join('');
  } else {
    options = '<option value="-1" disabled>The frequency is silent...</option>';
  }
  sel.innerHTML = options;
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function getProseSentences() {
  const body = document.getElementById('prose-body');
  if (!body.dataset.ttsReady) {
    const walker = document.createTreeWalker(body, NodeFilter.SHOW_TEXT, null);
    const textNodes = [];
    let n;
    while (n = walker.nextNode()) {
      if (n.nodeValue.trim()) textNodes.push(n);
    }
    textNodes.forEach(node => {
      const parts = node.nodeValue.match(/[^.!?]+[.!?]*\s*/g) || [node.nodeValue];
      const frag = document.createDocumentFragment();
      parts.forEach(p => {
        const span = document.createElement('span');
        span.className = 'tts-sentence';
        span.textContent = p;
        frag.appendChild(span);
      });
      node.parentNode.replaceChild(frag, node);
    });
    body.dataset.ttsReady = '1';
  }
  return Array.from(body.querySelectorAll('.tts-sentence')).filter(s => s.textContent.trim());
}

function toggleTTS() {
  if (!('speechSynthesis' in window) || ttsVoices.length === 0) {
    showToast("The frequency is silent. The colony's transmission is blocked in this vessel.", false);
    return;
  }
  ttsActive = !ttsActive;
  document.getElementById('tts-bar').classList.toggle('active', ttsActive);
  document.getElementById('tts-toggle-label').textContent = ttsActive ? 'Hide listen player' : 'Listen to this chapter';
  if (!ttsActive) ttsStop();
}

function closeTTS() {
  ttsActive = false;
  document.getElementById('tts-bar').classList.remove('active');
  document.getElementById('tts-toggle-label').textContent = 'Listen to this chapter';
  ttsStop();
}

function buildQueue() {
  const sentences = getProseSentences();
  ttsUtterances = sentences.map((span, i) => {
    const u = new SpeechSynthesisUtterance(span.textContent);
    u.rate = ttsRate;
    u.pitch = ttsPitch;
    const voiceIdx = parseInt(document.getElementById('tts-voice').value, 10);
    if (voiceIdx >= 0 && ttsVoices[voiceIdx]) u.voice = ttsVoices[voiceIdx];
    u.onstart = () => {
      document.querySelectorAll('.tts-sentence').forEach(s => s.classList.remove('tts-reading'));
      span.classList.add('tts-reading');
      span.scrollIntoView({ block: 'center', behavior: 'smooth' });
    };
    u.onend = () => {
      if (ttsActive && !ttsPaused && i === ttsIdx) {
        ttsIdx++;
        if (ttsIdx < ttsUtterances.length) {
          speechSynthesis.speak(ttsUtterances[ttsIdx]);
        } else {
          ttsFinished();
        }
      }
    };
    return u;
  });
}

function ttsFinished() {
  document.querySelectorAll('.tts-sentence').forEach(s => s.classList.remove('tts-reading'));
  document.getElementById('tts-play').textContent = '▶';
  ttsIdx = 0;
}

function ttsPlayPause() {
  const btn = document.getElementById('tts-play');
  if (speechSynthesis.speaking && !speechSynthesis.paused) {
    speechSynthesis.pause();
    ttsPaused = true;
    btn.textContent = '▶';
    return;
  }
  if (speechSynthesis.paused) {
    speechSynthesis.resume();
    ttsPaused = false;
    btn.textContent = '⏸';
    return;
  }
  if (!ttsUtterances.length) buildQueue();
  ttsPaused = false;
  btn.textContent = '⏸';
  speechSynthesis.speak(ttsUtterances[ttsIdx]);
}

function ttsStop() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  ttsUtterances = [];
  ttsIdx = 0;
  ttsPaused = false;
  const btn = document.getElementById('tts-play');
  if (btn) btn.textContent = '▶';
  document.querySelectorAll('.tts-sentence').forEach(s => s.classList.remove('tts-reading'));
}

function ttsRateChange(val) {
  ttsRate = parseFloat(val);
  if (speechSynthesis.speaking) {
    const wasIdx = ttsIdx;
    speechSynthesis.cancel();
    buildQueue();
    ttsIdx = wasIdx;
    speechSynthesis.speak(ttsUtterances[ttsIdx]);
  }
}

function ttsPitchChange(val) {
  ttsPitch = parseFloat(val);
  if (speechSynthesis.speaking) {
    const wasIdx = ttsIdx;
    speechSynthesis.cancel();
    buildQueue();
    ttsIdx = wasIdx;
    speechSynthesis.speak(ttsUtterances[ttsIdx]);
  }
}

function ttsVoiceChange() {
  if (speechSynthesis.speaking || ttsUtterances.length) {
    const wasIdx = ttsIdx;
    speechSynthesis.cancel();
    buildQueue();
    ttsIdx = wasIdx;
    if (!ttsPaused) speechSynthesis.speak(ttsUtterances[ttsIdx]);
  }
}

init();
